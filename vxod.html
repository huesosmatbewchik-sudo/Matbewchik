<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="CSS/vxod.css">
    <title>Вход - Видеосервис</title>
</head>
<body>
    <div class="page">
        <div class="box">
            <h1 class="title">Вход</h1>
            
            <form action="log.html" method="GET">
                <div class="field">
                    <label for="user">Логин</label>
                    <input type="text" name="username" id="user" class="input" pattern="admin" required>
                </div>
                
                <div class="field">
                    <label for="pass">Пароль (12345)</label>
                    <input type="password" name="password" id="pass" class="input" pattern="12345" title="Неверный пароль" required>
                </div>

                <div class="field-checkbox">
                    <input type="checkbox" id="remember" name="remember-me">
                    <label for="remember">Запомнить</label>
                </div>
                
                <button type="submit" class="btn">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
